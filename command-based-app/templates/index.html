<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail LLM Labeler - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #48bb78;
        }

        .btn-secondary:hover {
            background: #38a169;
        }

        .btn-danger {
            background: #f56565;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-running {
            background: #fef3c7;
            color: #92400e;
        }

        .status-completed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-queued {
            background: #e0e7ff;
            color: #3730a3;
        }

        .job-item {
            padding: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            margin-bottom: 10px;
            background: #f9fafb;
        }

        .job-item:hover {
            background: #f3f4f6;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .job-id {
            font-weight: 600;
            color: #374151;
        }

        .job-time {
            font-size: 12px;
            color: #6b7280;
        }

        .log-viewer {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .log-line {
            margin-bottom: 4px;
        }

        .log-error {
            color: #f87171;
        }

        .log-warning {
            color: #fbbf24;
        }

        .log-info {
            color: #60a5fa;
        }

        .log-success {
            color: #34d399;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #374151;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f9fafb;
            border-radius: 6px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #6b7280;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
        }

        .modal-close:hover {
            color: #374151;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📧 Gmail LLM Labeler Dashboard</h1>
            <p>Automated email labeling with transaction detection and LLM categorization</p>
        </div>

        <!-- Control Panel -->
        <div class="grid">
            <!-- Start Job Card -->
            <div class="card">
                <h2>🚀 Start New Job</h2>
                <div class="form-group">
                    <label>Job Type</label>
                    <select id="jobType">
                        <option value="complete">Complete Workflow (Transaction + LLM)</option>
                        <option value="transaction">Transaction Labeler Only</option>
                        <option value="pipeline">LLM Pipeline Only</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Transaction Limit</label>
                    <input type="number" id="transactionLimit" value="500" min="1">
                </div>
                <div class="form-group">
                    <label>Pipeline Limit</label>
                    <input type="number" id="pipelineLimit" value="200" min="1">
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="dryRun">
                    <label for="dryRun">Dry Run (Simulate Only)</label>
                </div>
                <button class="btn" onclick="startJob()">Start Job</button>
            </div>

            <!-- System Status Card -->
            <div class="card">
                <h2>📊 System Status</h2>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="activeJobsCount">0</div>
                        <div class="stat-label">Active Jobs</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="completedJobsCount">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="refreshStatus()" style="margin-top: 20px;">
                    Refresh Status
                </button>
            </div>

            <!-- Quick Actions Card -->
            <div class="card">
                <h2>⚡ Quick Actions</h2>
                <button class="btn" onclick="viewMetrics()">View Metrics</button>
                <button class="btn btn-secondary" onclick="viewAllLogs()">View All Logs</button>
                <button class="btn btn-danger" onclick="clearHistory()">Clear History</button>
            </div>
        </div>

        <!-- Active Jobs -->
        <div class="card">
            <h2>🔄 Active Jobs</h2>
            <div id="activeJobs">
                <div class="empty-state">No active jobs</div>
            </div>
        </div>

        <!-- Job History -->
        <div class="card">
            <h2>📜 Recent Jobs</h2>
            <div id="jobHistory">
                <div class="empty-state">No job history</div>
            </div>
        </div>
    </div>

    <!-- Log Viewer Modal -->
    <div id="logModal" class="modal">
        <div class="modal-content" style="width: 90%; max-width: 1200px;">
            <div class="modal-header">
                <h2 id="logModalTitle">Job Logs</h2>
                <button class="modal-close" onclick="closeLogModal()">&times;</button>
            </div>
            <div class="log-viewer" id="logContent">
                Loading logs...
            </div>
        </div>
    </div>

    <script>
        let statusInterval;

        // Start status polling
        function startPolling() {
            refreshStatus();
            statusInterval = setInterval(refreshStatus, 3000); // Poll every 3 seconds
        }

        // Refresh system status
        async function refreshStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                // Update counts
                document.getElementById('activeJobsCount').textContent = data.total_active;
                document.getElementById('completedJobsCount').textContent = data.job_history.length;

                // Update active jobs
                const activeJobsDiv = document.getElementById('activeJobs');
                if (data.active_jobs.length === 0) {
                    activeJobsDiv.innerHTML = '<div class="empty-state">No active jobs</div>';
                } else {
                    activeJobsDiv.innerHTML = data.active_jobs.map(job => renderJob(job, true)).join('');
                }

                // Update job history
                const historyDiv = document.getElementById('jobHistory');
                if (data.job_history.length === 0) {
                    historyDiv.innerHTML = '<div class="empty-state">No job history</div>';
                } else {
                    historyDiv.innerHTML = data.job_history.map(job => renderJob(job, false)).join('');
                }
            } catch (error) {
                console.error('Error refreshing status:', error);
            }
        }

        // Render job item
        function renderJob(job, isActive) {
            const statusClass = `status-${job.status}`;
            const time = job.start_time ? new Date(job.start_time).toLocaleString() : 'Not started';
            
            let actionButton = '';
            if (job.log_file) {
                actionButton = `<button class="btn" style="margin-top: 10px; padding: 8px 16px;" onclick="viewLog('${job.log_file}', '${job.id}')">View Logs</button>`;
            }

            let lastLog = '';
            if (isActive && job.last_log) {
                lastLog = `<div style="margin-top: 10px; padding: 10px; background: #f3f4f6; border-radius: 4px; font-size: 12px; font-family: monospace; color: #374151;">${escapeHtml(job.last_log)}</div>`;
            }

            return `
                <div class="job-item">
                    <div class="job-header">
                        <span class="job-id">${job.id}</span>
                        <span class="status-badge ${statusClass}">${job.status}</span>
                    </div>
                    <div class="job-time">Type: ${job.type} | Started: ${time}</div>
                    ${job.dry_run ? '<div style="color: #f59e0b; font-size: 12px; margin-top: 5px;">🔍 DRY RUN MODE</div>' : ''}
                    ${lastLog}
                    ${actionButton}
                </div>
            `;
        }

        // Start new job
        async function startJob() {
            const jobType = document.getElementById('jobType').value;
            const transactionLimit = parseInt(document.getElementById('transactionLimit').value);
            const pipelineLimit = parseInt(document.getElementById('pipelineLimit').value);
            const dryRun = document.getElementById('dryRun').checked;

            const payload = {
                type: jobType,
                transaction_limit: transactionLimit,
                limit: pipelineLimit,
                pipeline_limit: pipelineLimit,
                save_every: 40,
                dry_run: dryRun
            };

            try {
                const response = await fetch('/api/jobs/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.success) {
                    alert(`Job started successfully!\nJob ID: ${data.job_id}`);
                    refreshStatus();
                } else {
                    alert('Failed to start job');
                }
            } catch (error) {
                console.error('Error starting job:', error);
                alert('Error starting job: ' + error.message);
            }
        }

        // View log file
        async function viewLog(filename, jobId) {
            document.getElementById('logModalTitle').textContent = `Logs: ${jobId}`;
            document.getElementById('logModal').classList.add('active');
            document.getElementById('logContent').textContent = 'Loading logs...';

            try {
                const response = await fetch(`/api/logs/${filename}`);
                const data = await response.json();

                if (data.content) {
                    const formatted = formatLogContent(data.content);
                    document.getElementById('logContent').innerHTML = formatted;
                } else {
                    document.getElementById('logContent').textContent = 'No log content available';
                }
            } catch (error) {
                document.getElementById('logContent').textContent = 'Error loading logs: ' + error.message;
            }
        }

        // Format log content with colors
        function formatLogContent(content) {
            return content.split('\n').map(line => {
                let className = '';
                if (line.includes('ERROR') || line.includes('✗')) {
                    className = 'log-error';
                } else if (line.includes('WARNING') || line.includes('WARN')) {
                    className = 'log-warning';
                } else if (line.includes('INFO') || line.includes('✓')) {
                    className = 'log-info';
                } else if (line.includes('SUCCESS') || line.includes('COMPLETE')) {
                    className = 'log-success';
                }
                return `<div class="log-line ${className}">${escapeHtml(line)}</div>`;
            }).join('');
        }

        // Close log modal
        function closeLogModal() {
            document.getElementById('logModal').classList.remove('active');
        }

        // View metrics
        async function viewMetrics() {
            try {
                const response = await fetch('/api/metrics');
                const data = await response.json();
                alert('Metrics:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                alert('No metrics available yet');
            }
        }

        // View all logs
        function viewAllLogs() {
            alert('Opening logs directory...\nCheck the /logs folder in your project directory');
        }

        // Clear history
        function clearHistory() {
            if (confirm('Are you sure you want to clear job history?')) {
                alert('History cleared (feature not implemented yet)');
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal on outside click
        document.getElementById('logModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLogModal();
            }
        });

        // Start polling on page load
        window.addEventListener('load', startPolling);
    </script>
</body>
</html>
